<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Producto</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div th:replace="~{menu :: navbar}"></div>
    <main class="contenedor">
        <h2 th:text="${producto.id == null ? 'Crear nuevo producto' : 'Editar producto'}"></h2>

        <!-- ANTES: /producto/guardar (minúscula) -> 404, el controlador es /Producto -->
        <form th:action="@{/Producto/guardar}" th:object="${producto}" method="post">
            <input type="hidden" th:field="*{id}">

            <label>Nombre del producto</label>
            <input type="text" th:field="*{nombre}" required maxlength="100">

            <label>Descripción</label>
            <textarea th:field="*{descripcion}" required rows="3"></textarea>

            <label>Valor unitario ($)</label>
            <input type="number" th:field="*{valorUnitario}" min="0.01" step="0.01" required>

            <label>Stock (unidades)</label>
            <input type="number" th:field="*{stock}" min="0" step="1" required>

            <button type="submit">Guardar producto</button>
        </form>
        <div class="centrado"><a th:href="@{/Producto/listar}">← Cancelar y volver al inventario</a></div>
    </main>
</body>
</html>
