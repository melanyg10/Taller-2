<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="navbar" class="navbar">
        <nav class="nav-inner">
            <a class="brand" th:href="@{/admin}">Mi Tienda <span>Web</span></a>

            <!-- Menú hamburguesa sin JavaScript (checkbox hack) -->
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="hamburger" aria-label="Abrir menú">&#9776;</label>

            <div class="nav-links" th:if="${session.usuarioRol != null}">
                <th:block th:if="${session.usuarioRol == 'ADMIN'}">
                    <a th:href="@{/admin}">Usuarios Pendientes</a>
                    <a th:href="@{/Producto/listar}">Productos</a>
                    <a th:href="@{/Cliente/listar}">Clientes</a>
                    <a th:href="@{/admin/compras}">Compras</a>
                </th:block>
                <th:block th:if="${session.usuarioRol == 'CLIENTE'}">
                    <a th:href="@{/Cliente/perfil}">Mi Perfil</a>
                    <a th:href="@{/compra}">Comprar</a>
                </th:block>
            </div>

            <div class="nav-user">
                <th:block th:if="${session.usuarioRol != null}">
                    <span class="badge" th:text="${session.usuarioCorreo}"></span>
                    <a class="salir" th:href="@{/login/logout}">Salir</a>
                </th:block>
                <th:block th:if="${session.usuarioRol == null}">
                    <a class="salir" style="background:#22c55e" th:href="@{/login}">Ingresar</a>
                </th:block>
            </div>
        </nav>
    </header>
</body>
</html>
