<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div th:replace="~{menu :: navbar}"></div>
    <main class="contenedor ancho">
        <h1>Listado de Clientes</h1>
        <div class="tabla-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Fecha de creación</th></tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.apellido}"></td>
                        <td th:text="${cliente.correo}"></td>
                        <td th:text="${cliente.createAt != null ? #dates.format(cliente.createAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
