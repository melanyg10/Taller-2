<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="/estilos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}"></title>
    
    <style>
        /* Estilos modernos específicos para la tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #87CEFA; /* Azul claro para los encabezados */
            color: #003366;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f0f8ff; /* Efecto hover azul muy suave en las filas */
        }
    </style>
</head>
<body>

    <!-- Contenedor ampliado ligeramente para acomodar la tabla -->
    <div class="contenedor" style="max-width: 800px;">
        
        <h1 th:text="${titulo}" style="color: #003366; text-align: center;"></h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Fecha de Creación</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.apellido}"></td>
                    <td th:text="${cliente.email}"></td>
                    <td th:text="${cliente.createAt}"></td>
                </tr>
            </tbody>
        </table>
        
    </div>

</body>
</html>
