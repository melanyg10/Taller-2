<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div th:replace="~{menu :: navbar}"></div>
    <main class="contenedor ancho">
        <div class="acciones">
            <h1 style="margin:0">Inventario de Productos</h1>
            <a class="btn btn-ok" th:href="@{/Producto/formulario}">+ Nuevo producto</a>
        </div>
        <div class="tabla-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Valor unitario</th><th>Stock</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${Producto}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="${p.descripcion}"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(p.valorUnitario, 0, 'POINT', 2, 'COMMA')}"></td>
                        <td th:text="${p.stock}"></td>
                        <td style="display: flex; gap: 5px; align-items: center;">
                          <a class="btn btn-edit btn-sm" th:href="@{/Producto/editar/{id}(id=${p.id})}">Editar</a>
                          <a class="btn btn-delete btn-sm" style="background-color: #dc3545; color: white;" 
                          th:href="@{/Producto/eliminar/{id}(id=${p.id})}" 
                          onclick="return confirm('¿Estás seguro de que deseas eliminar este producto?');">
                          Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
