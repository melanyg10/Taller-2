<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div th:replace="~{menu :: navbar}"></div>
    <main class="contenedor">
        <h1>Crear Cuenta</h1>
        <p class="subtitulo">Tu cuenta será revisada por un administrador</p>
        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/login/registro}" method="post">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            <label for="contrasena">Contraseña (mín. 8 caracteres, con letra y número)</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña segura"
                   required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
                   title="Mínimo 8 caracteres, con al menos una letra y un número">
            <button type="submit">Solicitar acceso</button>
        </form>
        <div class="centrado">¿Ya tienes cuenta? <a th:href="@{/login}"><strong>Inicia sesión</strong></a></div>
    </main>
</body>
</html>
