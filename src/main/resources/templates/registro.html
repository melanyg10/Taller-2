<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/estilos.css">
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
</head>
<body>

    <div class="contenedor">
        
        <h1 style="color: #003366; text-align: center;">Crear Cuenta</h1>

        <p th:if="${error}" th:text="${error}" style="color: #e74c3c; text-align: center; font-weight: bold;"></p>

        <!-- Apunta a la ruta de registro en el controlador -->
        <form th:action="@{/login/registro}" method="post">
            
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required> 

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña segura" required> 

            <button type="submit">Solicitar Acceso</button>

        </form>

        <div style="text-align: center; margin-top: 15px;">
            <p>¿Ya tienes cuenta? <a href="/login" style="color: #003366; font-weight: bold;">Inicia sesión aquí</a></p>
        </div>
        
    </div>

</body>
</html>
