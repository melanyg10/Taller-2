<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras registradas</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div th:replace="~{menu :: navbar}"></div>

    <main class="contenedor ancho">
        <h1>Compras registradas</h1>

        <p class="subtitulo">
            Consulta los encabezados de compra y abre cada uno para ver sus productos.
        </p>

        <div class="tabla-wrap"
             th:if="${!#lists.isEmpty(compras)}">

            <table>
                <thead>
                    <tr>
                        <th>N.º compra</th>
                        <th>Cliente</th>
                        <th>Correo</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Detalle</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="compra : ${compras}">
                        <td th:text="${compra.id}"></td>

                        <td th:text="${compra.cliente.nombre
                            + ' ' + compra.cliente.apellido}">
                        </td>

                        <td th:text="${compra.cliente.correo}"></td>

                        <td th:text="${#dates.format(
                            compra.fecha, 'dd/MM/yyyy HH:mm')}">
                        </td>

                        <td th:text="${'$' + #numbers.formatDecimal(
                            compra.total, 0, 'POINT', 2, 'COMMA')}">
                        </td>

                        <td>
                            <a class="btn btn-edit btn-sm"
                               th:href="@{/admin/compras/{id}(id=${compra.id})}">
                                Ver detalle
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="vacio"
           th:if="${#lists.isEmpty(compras)}">
            Todavía no hay compras registradas.
        </p>
    </main>
</body>
</html>
