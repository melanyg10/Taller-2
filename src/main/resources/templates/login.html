<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div th:replace="~{menu :: navbar}"></div>
    <main class="contenedor">
        <h1>Iniciar Sesión</h1>
        <p class="subtitulo">Bienvenido de nuevo a Sistema de Ventas e Inventario</p>
        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
        <p class="alert alert-ok" th:if="${mensaje}" th:text="${mensaje}"></p>
        <form th:action="@{/login}" method="post">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <div class="centrado">¿No tienes cuenta? <a th:href="@{/login/registro}"><strong>Regístrate aquí</strong></a></div>
    </main>
</body>
</html>
