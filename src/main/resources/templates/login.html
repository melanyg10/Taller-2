<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="/estilos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
</head>
<body>

    <!-- Envolvemos todo en el contenedor -->
    <div class="contenedor">
        
        <h1 style="color: #003366; text-align: center;">Iniciar Sesión</h1>

        <!-- Muestra el mensaje de error centrado y con un rojo un poco más moderno -->
        <p th:if="${error}" th:text="${error}" style="color: #e74c3c; text-align: center; font-weight: bold;"></p>

        <!--
            action="/login" → apunta al POST /login del LoginController
            method="post"   → envía los datos como POST
        -->
        <form action="/login" method="post">

            <label for="correo">Correo:</label>
            <!-- Eliminamos los <br> y agregamos un placeholder -->
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>

            <button type="submit">Ingresar</button>

        </form>
        
    </div>

</body>
</html>
